<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Table</title>
</head>
<body>
    <h2>Here's a Company Website Structure shown in Table.</h2>
    <table border="1" cellspacing="0" width="100%" cellpadding="5">
        <tr>
            <th>
                <img src="assets/ab2.png" alt="Company Logo" width="50" style="border-radius: 50%;">
            </th>
            <th>Aryal Traders & Suppliers</th>
        </tr>
        <tr>
            <th>
                <table border="1" cellspacing="0" cellpadding="5" width="90%" align="center">
                    <tr>
                       <td><a href="assets/home.html">Home</a></td> 
                    </tr>
                    <tr>
                       <td><a href="assets/about.html">About Us</a></td> 
                    </tr>
                    <tr>
                       <td><a href="assets/contact.html">Contact Us</a></td> 
                    </tr>
                </table>
            </th>
            <td>
                <table border="1" cellspacing="0" width="90%" cellpadding="5" >
                    <tr>
                        <td>Content 1</td>
                        <td>News 1</td>
                    </tr>
                    <tr>
                        <td>Content 2</td>
                        <td>News 2</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td> &copy; Copyright</td>
            <td>
                <table width="100%" border="1" cellspacing="0" cellpadding="5">
                    <tr>
                        <td>
                            <a href="#">Facebook</a>
                            <a href="#">Twitter</a>
                        </td>
                        <td>Powered By</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
