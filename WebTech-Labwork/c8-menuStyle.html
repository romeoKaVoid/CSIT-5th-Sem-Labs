<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Style</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        li{
            display: inline;
        }
        a{
            text-decoration: none;
            border: 2px solid black;
            border-radius: 5px;
            padding: 7px 25px;
            margin: 5px;
            color: rgb(78, 124, 223);
            font-size: 16px;
        }
        a:hover{
            background-color: rgb(38, 169, 125);
            color: red;
            transition: 0.7s ease;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h2>Horizontal menu</h2>
    <ul>
        <li><a href="assets/home.html">Home</a></li>
        <li><a href="assets/about.html">About</a></li>
        <li><a href="assets/services.html">Services</a></li>
        <li><a href="assets/gallery.html">Gallery</a></li>
        <li><a href="assets/contact.html">Contact</a></li>
    </ul>
</body>
</html>
