<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video</title>
</head>
<body>
    <div>
        <h2>This is Audio Section!!</h2>
        <audio controls>
            <source src="assets/ting.mp3" type="audio/mp3">
        </audio>
    </div>

    <div>
        <h2>This is Video Section!!</h2>
        <video width="500" height="350" controls  autoplay loop>
            <source src="assets/mountain.mp4" type="video/mp4">
        </video>
    </div>

</body>
</html>
