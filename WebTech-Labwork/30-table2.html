<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Custom Tables</title>
</head>
<body>
    <h2>Here I created a custom table.</h2>
    <table border="1" cellspacing="0"  width="50%" cellpadding="5">
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
        </tr>
        <tr>
            <td rowspan="2" colspan="3" style="vertical-align: text-top;">E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
        </tr>
        <tr>
            <td colspan="2">H</td>
            <td>J</td>
            <td>K</td>
        </tr>
        <tr>
            <td colspan="2">L</td>
            <td colspan="2">M</td>
        </tr>
    </table>
</body>
</html>
