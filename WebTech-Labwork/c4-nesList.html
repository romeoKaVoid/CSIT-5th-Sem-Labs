<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List</title>
    <style>
        body{
            font-family: Arial;
        }
        ul{
            color: blue;
        }
        ol{
            border: 2px solid black;
            border-radius: 15px;
            width: 400px;
            color: green;
        }
        li{
            margin: 5px;
        }
    </style>
</head>
<body>
    <h2>My Subjects and Topics</h2>
    <ul>
        <li>Programming
            <ol>
                <li>C Languages</li>
                <li>C++</li>
                <li>Python</li>
            </ol>
        </li>

        <li>Web Development
            <ol>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ol>
        </li>

        <li>Database
            <ol>
                <li>MySQL</li>
                <li>Oracle</li>
            </ol>
        </li>
    </ul>
</body>
</html>
