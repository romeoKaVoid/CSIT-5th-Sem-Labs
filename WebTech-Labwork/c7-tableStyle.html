<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Table</title>
    <style>
        h1{
            color: rgb(159, 11, 11);
        }
        table{
            border: 5px solid rgb(180, 20, 212);
            width: 600px;
            height: 550px;
            border-radius: 10px;
        }
        th,td{
            border: 3px solid rgb(19, 154, 203);
            border-radius: 5px;
            padding: 15px;
            text-align: center;
        }
        .classA{
            background-color: rgb(158, 158, 214);
            color: rgb(86, 88, 89);
        }
        .classB{
            background-color: rgb(110, 110, 141);
            color: rgb(80, 7, 93);
        }
        .classC{
            background-color: rgb(228, 149, 100);
            color: rgb(62, 3, 189);
            text-transform: uppercase;
        }
        .classD{
            background-color: rgb(237, 151, 151);
            color: rgb(57, 22, 114);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <h1>Styling Table</h1>
    <table>
        <tr>
            <th class="classA">Class A</th>
            <th class="classB">Class B</th>
        </tr>
        <tr>
            <td class="classC">Class C</td>
            <td class="classD">Class D</td>
        </tr>
    </table>
</body>
</html>
