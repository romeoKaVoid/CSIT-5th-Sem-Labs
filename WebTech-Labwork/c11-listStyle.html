<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Devices lists</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h2{
            color: red;
            text-decoration: underline;
            /* font-weight: bolder; */
        }
        ul{
            list-style: none;
            padding: 0;
            width: 200px;
            margin: 20px 0;
        }
        li{
            background-color: lightblue;
            margin:5px;
            padding: 8px;
            border: 1px solid black;
            border-radius: 7px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Devices:</h2>
    <ul>
        <li>Mouse</li>
        <li>Keyboard</li>
        <li>Monitor</li>
        <li>Printer</li>
        <li>Touchpad</li>
    </ul>
</body>
</html>
