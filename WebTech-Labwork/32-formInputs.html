<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs type in From</title>
</head>
<body>
    <h1>Different types of INPUTS in HTML form!!</h1>
    <form action="#" method="post">
        <!-- Text Input -->
        <label for="text-input">Text Input: </label>
       <input type="text" id="text-input" name="text-input" placeholder="Enter text here..">
       <br><br>
       
       <!-- Password Inputs -->
       <label for="password-input">Password Input: </label>
       <input type="password" id="password-input" name="password-input" placeholder="Enter password here..">
       <br><br>

       <!-- Radio Buttons -->
       <label>Radio Buttons: </label><br>
       <input type="radio" id="radio1" name="radio-group" value="option1">
       <label for="radio1">Option 1</label>
       <input type="radio" id="radio2" name="radio-group" value="option2">
       <label for="radio2">Option 2</label>
       <br><br>
       

       <!-- Checkboxes -->
        <label>Checkboxes:</label><br>
        <input type="checkbox" id="checkbox1" name="checkbox1" value="checkbox1">
        <label for="checkbox1"> Checkbox1</label>
        <input type="checkbox" id="cehckbox2" name="checkbox2" value="checkbox2">
        <label for="checkbox2">Checkbox2</label>
        <br><br>

        <!-- Number Input -->
         <label for="number-input">Input Number: </label>
         <input type="number" id="number-input" name="number-input" min="1" max="100">
         <br><br>

         <!-- Date Input -->
          <label for="date-input">Input Date: </label>
          <input type="date" id="date-input" name="date-input">
          <br><br>

          <!-- Color Input -->
           <label for="color-input">Color Input: </label>
           <input type="color" id="color-input" name="color-input">
           <br><br>

           <!-- File Input -->
            <label for="file-input">File Input: </label>
            <input type="file" id="file-input" name="file-input">
            <br><br>

            <!-- Range Input -->
             <label for="range-input">Range Input: </label>
             <input type="range" id="range-inpt" name="range-inpt">
             <br><br>

             <!-- Email Input -->
              <label for="email-input">Enter Email : </label>
              <input type="email" id="email-input" name="email-input" placeholder="Enter your email here..">
              <br><br>

              <!-- Submit Button -->
               <input type="submit" value="Submit">

    </form>
</body>
</html>
