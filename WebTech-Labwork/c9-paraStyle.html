<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Paragraph</title>
    <style>
        p::before{
            content: "Important Note: ";
            color: red;
            background-color: yellow;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <h2>Paragraph Styling </h2>
    <div>
        <p>This paragraph explains the basic concept of CSS pseudo-elements.</p>
    </div>
</body>
</html>
