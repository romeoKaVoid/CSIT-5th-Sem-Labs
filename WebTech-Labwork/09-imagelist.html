<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image List</title>
</head>
<body>
    <h1>Image Unordered List</h1>
    <ul>
        <li><img src="assets/image1.jpg" alt="Error Loading Image" width="100"></li>
        <li><img src="assets/image2.jpg" alt="Error Loading Image" width="100"></li>
    </ul>
    <h1>Image Ordered List</h1>
    <ol>
        <li><img src="assets/image2.jpg" alt="Error Loading Image" width="100"></li>
        <li><img src="assets/image1.jpg" alt="Error Loading Image" width="100"></li>
    </ol>
</body>
</html>
