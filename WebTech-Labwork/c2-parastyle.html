<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Styling</title>
    <style>
        p{
            /* color: green; */
            font-size: 15px;
            font-weight: 900;
        }
        .p1{
            color: blue;
            margin-bottom: 16px;
            font-style: italic;

        }
        .p2{
            color: purple;
            text-decoration: underline;
        }
        .p3{
            color: red;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <p class="p1">My name is Krishna Aryal and I am a computer science student..</p>
    <p class="p2">I enjoy learning programming and improving my coding skills.</p>
    <p class="p3">I am curious to explore new technologies and tools.</p>
</body>
</html>
