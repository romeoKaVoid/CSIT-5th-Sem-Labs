<svg width="1080" height="1010" viewBox="0 0 1080 1010" xmlns="http://www.w3.org/2000/svg">
<rect width="1080" height="1010" fill="#ffffff"/>
<defs>
<marker id="sa_solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3A37"/></marker>
<marker id="sa_open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#3A3A37" stroke-width="1.6"/></marker>
</defs>
<rect x="30.0" y="30" width="160" height="42" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="110" y="56.0" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#0C447C">Customer</text>
<line x1="110" y1="72" x2="110" y2="970" stroke="#A9A79E" stroke-width="1.3" stroke-dasharray="4,4"/>
<rect x="300.0" y="30" width="160" height="42" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="380" y="56.0" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#0C447C">Merchant App</text>
<line x1="380" y1="72" x2="380" y2="970" stroke="#A9A79E" stroke-width="1.3" stroke-dasharray="4,4"/>
<rect x="580.0" y="30" width="160" height="42" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="660" y="56.0" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#0C447C">Payment Gateway</text>
<line x1="660" y1="72" x2="660" y2="970" stroke="#A9A79E" stroke-width="1.3" stroke-dasharray="4,4"/>
<rect x="860.0" y="30" width="160" height="42" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="940" y="56.0" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#0C447C">Bank / Issuer</text>
<line x1="940" y1="72" x2="940" y2="970" stroke="#A9A79E" stroke-width="1.3" stroke-dasharray="4,4"/>
<line x1="110" y1="110" x2="380" y2="110" stroke="#3A3A37" stroke-width="1.5" marker-end="url(#sa_solid)"/>
<text x="245.0" y="102" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#222">1: Add items &amp; click Pay</text>
<line x1="380" y1="165" x2="660" y2="165" stroke="#3A3A37" stroke-width="1.5" marker-end="url(#sa_solid)"/>
<text x="520.0" y="157" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#222">2: Create order request</text>
<line x1="660" y1="220" x2="380" y2="220" stroke="#3A3A37" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#sa_open)"/>
<text x="520.0" y="212" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#222">3: Order created (order ID, amount)</text>
<line x1="380" y1="275" x2="110" y2="275" stroke="#3A3A37" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#sa_open)"/>
<text x="245.0" y="267" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#222">4: Show payment options</text>
<line x1="110" y1="330" x2="380" y2="330" stroke="#3A3A37" stroke-width="1.5" marker-end="url(#sa_solid)"/>
<text x="245.0" y="322" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#222">5: Select method &amp; confirm payment</text>
<line x1="380" y1="385" x2="660" y2="385" stroke="#3A3A37" stroke-width="1.5" marker-end="url(#sa_solid)"/>
